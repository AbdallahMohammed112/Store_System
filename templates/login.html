<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام المتجر</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, 'Tajawal', sans-serif; 
            background-color: #eef2f5; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh;
            color: #333;
        }
        .login-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h1 {
            margin: 0;
            color: #2c3e50;
            font-size: 24px;
        }
        .login-header p {
            margin: 5px 0 0;
            color: #7f8c8d;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #2c3e50;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #f8faff;
            transition: 0.3s;
        }
        .input-group input:focus {
            border-color: #2980b9;
            outline: none;
            background-color: #fff;
        }
        .login-btn {
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-btn:hover {
            background-color: #1a569d;
        }
        /* تنسيق رسالة الخطأ من بايثون */
        .alert-error {
            background-color: #ffcccc; 
            color: #cc0000; 
            padding: 12px; 
            border-radius: 6px; 
            margin-bottom: 20px; 
            text-align: center; 
            font-weight: bold;
            font-size: 14px;
            border: 1px solid #ffb3b3;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1>نظام المتجر الذكي</h1>
            <p>قم بتسجيل الدخول للمتابعة</p>
        </div>

        <!-- مكان عرض رسائل الخطأ القادمة من بايثون -->
        {% with messages = get_flashed_messages(category_filter=["error"]) %}
          {% if messages %}
            <div class="alert-error">
              {{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}

        <!-- نموذج تسجيل الدخول المربوط بالسيرفر -->
        <form method="POST" action="/">
            <div class="input-group">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" name="username" required placeholder="أدخل اسم المستخدم...">
            </div>
            
            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" required placeholder="أدخل كلمة المرور...">
            </div>
            
            <button type="submit" class="login-btn">دخول للنظام</button>
        </form>
    </div>

</body>
</html>
